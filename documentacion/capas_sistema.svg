<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="Segoe UI, Arial, sans-serif">
<title>Capas del sistema y cómo interactúan</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect width="920" height="620" fill="#ffffff"/>
<rect x="15" y="12" width="890" height="125" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/><text x="27" y="29" font-size="11" text-anchor="start" fill="#475569" font-weight="700">1 · CLIENTES (presentación)</text>
<rect x="30" y="38" width="200" height="86" rx="8" fill="#e8f1fa" stroke="#1f4e79" stroke-width="1.5"/>
<text x="130.0" y="59" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">App Android</text>
<text x="130.0" y="76" font-size="11" text-anchor="middle" fill="#1f2937">Compose · Room · WorkManager</text>
<text x="130.0" y="93" font-size="11" text-anchor="middle" fill="#1f2937">sin red: queda pendiente</text>
<rect x="250" y="38" width="200" height="86" rx="8" fill="#e8f1fa" stroke="#1f4e79" stroke-width="1.5"/>
<text x="350.0" y="59" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">Bruno / cliente HTTP</text>
<text x="350.0" y="76" font-size="11" text-anchor="middle" fill="#1f2937">POST /validar · /analizar</text>
<text x="350.0" y="93" font-size="11" text-anchor="middle" fill="#1f2937">X-Api-Key o JWT</text>
<rect x="470" y="38" width="200" height="86" rx="8" fill="#e8f1fa" stroke="#1f4e79" stroke-width="1.5"/>
<text x="570.0" y="59" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">Ventana tkinter (gui.py)</text>
<text x="570.0" y="76" font-size="11" text-anchor="middle" fill="#1f2937">analiza carpetas de fotos</text>
<text x="570.0" y="93" font-size="11" text-anchor="middle" fill="#1f2937">exporta un JSON consolidado</text>
<rect x="690" y="38" width="200" height="86" rx="8" fill="#e8f1fa" stroke="#1f4e79" stroke-width="1.5"/>
<text x="790.0" y="59" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">run.py (CLI)</text>
<text x="790.0" y="76" font-size="11" text-anchor="middle" fill="#1f2937">set ciego → JSON oficial</text>
<text x="790.0" y="93" font-size="11" text-anchor="middle" fill="#1f2937">llama al motor directo</text>
<rect x="15" y="148" width="455" height="76" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/><text x="27" y="165" font-size="11" text-anchor="start" fill="#475569" font-weight="700">2 · RED</text>
<rect x="30" y="172" width="425" height="44" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="242.5" y="193" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">Cloudflare · api.jamp.digital</text>
<text x="242.5" y="209" font-size="11" text-anchor="middle" fill="#1f2937">termina TLS · túnel saliente cloudflared → este PC (sin abrir puertos)</text>
<rect x="15" y="236" width="455" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/><text x="27" y="253" font-size="11" text-anchor="start" fill="#475569" font-weight="700">3 · API</text>
<rect x="30" y="260" width="425" height="58" rx="8" fill="#fff4e0" stroke="#b26a00" stroke-width="1.5"/>
<text x="242.5" y="281" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">server.py (Python, 127.0.0.1:8000)</text>
<text x="242.5" y="297" font-size="11" text-anchor="middle" fill="#1f2937">GET /health · /imagenes · POST /validar · /analizar</text>
<text x="242.5" y="313" font-size="11" text-anchor="middle" fill="#1f2937">autentica · valida el cuerpo · guarda fotos y JSON</text>
<rect x="15" y="336" width="890" height="142" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/><text x="27" y="353" font-size="11" text-anchor="start" fill="#475569" font-weight="700">4 · MOTOR (engine/, Python)</text>
<rect x="30" y="358" width="200" height="108" rx="8" fill="#e9f7ef" stroke="#2e7d32" stroke-width="1.5"/>
<text x="130.0" y="379" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">1 · Chequeos locales</text>
<text x="130.0" y="398" font-size="11" text-anchor="middle" fill="#1f2937">OpenCV: nitidez y moiré</text>
<text x="130.0" y="417" font-size="11" text-anchor="middle" fill="#1f2937">zxing-cpp: códigos de barras</text>
<text x="130.0" y="436" font-size="11" text-anchor="middle" fill="#1f2937">sin tokens</text>
<rect x="250" y="358" width="200" height="108" rx="8" fill="#eef2ff" stroke="#3949ab" stroke-width="1.5"/>
<text x="350.0" y="379" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">2 · Visión con IA</text>
<text x="350.0" y="398" font-size="11" text-anchor="middle" fill="#1f2937">Claude Haiku 5.5</text>
<text x="350.0" y="417" font-size="11" text-anchor="middle" fill="#1f2937">3 fotos ≤ 1024 px, 1 llamada</text>
<text x="350.0" y="436" font-size="11" text-anchor="middle" fill="#1f2937">7 criterios, precios y datos</text>
<rect x="470" y="358" width="200" height="108" rx="8" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="1.5"/>
<text x="570.0" y="379" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">3 · Catálogo y modo auto</text>
<text x="570.0" y="398" font-size="11" text-anchor="middle" fill="#1f2937">auto.py + catalogo.py</text>
<text x="570.0" y="417" font-size="11" text-anchor="middle" fill="#1f2937">completa id, precios y producto</text>
<text x="570.0" y="436" font-size="11" text-anchor="middle" fill="#1f2937">con duda no rellena</text>
<rect x="690" y="358" width="200" height="108" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="790.0" y="379" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">4 · Reglas y salida</text>
<text x="790.0" y="398" font-size="11" text-anchor="middle" fill="#1f2937">decide.py · output.py</text>
<text x="790.0" y="417" font-size="11" text-anchor="middle" fill="#1f2937">rechazar → aprobar → manual</text>
<text x="790.0" y="436" font-size="11" text-anchor="middle" fill="#1f2937">JSON validado, con respaldo</text>
<rect x="15" y="492" width="890" height="112" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/><text x="27" y="509" font-size="11" text-anchor="start" fill="#475569" font-weight="700">5 · DATOS Y SERVICIOS</text>
<rect x="30" y="518" width="200" height="72" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="130.0" y="539" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">Disco local</text>
<text x="130.0" y="557" font-size="11" text-anchor="middle" fill="#1f2937">salida_api/ · salida_carpetas/</text>
<text x="130.0" y="575" font-size="11" text-anchor="middle" fill="#1f2937">fotos y un JSON por captura</text>
<rect x="250" y="518" width="200" height="72" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="350.0" y="539" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">Azure AI Foundry</text>
<text x="350.0" y="557" font-size="11" text-anchor="middle" fill="#1f2937">endpoint asignado al equipo</text>
<text x="350.0" y="575" font-size="11" text-anchor="middle" fill="#1f2937">única IA externa usada</text>
<rect x="470" y="518" width="200" height="72" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="570.0" y="539" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">Catálogo de producto</text>
<text x="570.0" y="557" font-size="11" text-anchor="middle" fill="#1f2937">catalogo_productos.csv</text>
<text x="570.0" y="575" font-size="11" text-anchor="middle" fill="#1f2937">135 SKU</text>
<rect x="690" y="518" width="200" height="72" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="790.0" y="539" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="700">Salida: JSON del reto</text>
<text x="790.0" y="557" font-size="11" text-anchor="middle" fill="#1f2937">decision · reason_code ·</text>
<text x="790.0" y="575" font-size="11" text-anchor="middle" fill="#1f2937">validaciones · precios</text>
<text x="590" y="154" font-size="11" text-anchor="start" fill="#475569" font-weight="700">Interacción</text>
<text x="590" y="172" font-size="10.5" text-anchor="start" fill="#1f2937">① HTTPS: fotos + datos</text>
<text x="590" y="188" font-size="10.5" text-anchor="start" fill="#1f2937">② túnel de Cloudflare → PC</text>
<text x="590" y="204" font-size="10.5" text-anchor="start" fill="#1f2937">③ server.py → motor</text>
<text x="590" y="220" font-size="10.5" text-anchor="start" fill="#1f2937">④ motor → Haiku y catálogo</text>
<text x="590" y="236" font-size="10.5" text-anchor="start" fill="#1f2937">La ventana y run.py llaman</text>
<text x="590" y="252" font-size="10.5" text-anchor="start" fill="#1f2937">al motor directo, sin red.</text>
<text x="590" y="268" font-size="10.5" text-anchor="start" fill="#1f2937">Sin red: la app guarda en Room</text>
<text x="590" y="284" font-size="10.5" text-anchor="start" fill="#1f2937">y WorkManager reenvía.</text>
