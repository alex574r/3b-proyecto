<path d="M570.0,124.0 L570.0,349.0" stroke="#4b5563" stroke-width="1.6" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
<path d="M790.0,124.0 L790.0,349.0" stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
