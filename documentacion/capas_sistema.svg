<circle cx="258" cy="238" r="9" fill="#1f4e79"/><text x="258" y="242" font-size="11" text-anchor="middle" fill="#fff" font-weight="700">2</text>
<circle cx="258" cy="338" r="9" fill="#1f4e79"/><text x="258" y="342" font-size="11" text-anchor="middle" fill="#fff" font-weight="700">3</text>
