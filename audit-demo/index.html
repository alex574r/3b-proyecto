<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Panel de gestión y auditoría de Validat3B.">
  <meta name="theme-color" content="#fbf6f6">
  <title>Validat3B · Gestión y auditoría</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" type="module"></script>
</head>
<body>
  <a href="#principal" class="skip">Saltar al contenido</a>
  <header class="app-header">
    <a class="identity" href="#resumen">
      <img src="assets/logo.png" alt="" width="36" height="36">
      <span><strong>Validat3B</strong><small>Operaciones de campo</small></span>
    </a>
    <div class="session">
      <span class="badge neutral" id="modo"></span>
      <a id="cambiar-modo" class="button subtle"></a>
      <div class="identity auditor">
        <img src="assets/personaje.png" alt="" width="36" height="36">
        <span><strong>Operaciones 3B</strong><small>Rol de auditoría</small></span>
      </div>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <nav id="menu" aria-label="Navegación de auditoría"></nav>
    </aside>
    <main id="principal" tabindex="-1" aria-busy="true">
      <p role="status">Cargando el panel…</p>
    </main>
  </div>
  <dialog id="dialogo" aria-labelledby="dialog-title"></dialog>
</body>
</html>
